services:
  app:
    build:
      context: .
      args:
        BIN: server
    depends_on:
      mongodb:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-scheduler}
      NATS_URL: nats://nats:4222
    ports:
      - "8080:8080"
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10
  nats:
    image: nats:2
    ports:
      - "4222:4222"

volumes:
  mongodb_data:
